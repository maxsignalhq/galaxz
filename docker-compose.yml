services:
  aether:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  pulsar:
    build: .
    image: galaxz:latest
    depends_on:
      aether:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    ports:
      - "8003:8003"
    command: python -u services/pulsar_service.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  vega:
    # Optional future distributed-runtime service.
    # The default Galaxz service already boots Vega in-process for low-cost local use.
    profiles:
      - distributed-agents
    build: .
    image: galaxz:latest
    depends_on:
      aether:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    ports:
      - "8080:8080"
    command: python -u services/vega_service.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  rigel:
    # Optional future distributed-runtime service.
    # The default Galaxz service already boots Rigel in-process for low-cost local use.
    profiles:
      - distributed-agents
    build: .
    image: galaxz:latest
    depends_on:
      aether:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Generation-only by default. Code execution is an explicit opt-in
      # capability handled by a separate skill/runtime.
      RIGEL_EXECUTION_CALIBRATION_ENABLED: "false"
      RIGEL_CONFIDENCE_COMPLETION_THRESHOLD: "0.65"
      RIGEL_CONFIDENCE_FAILURE_THRESHOLD: "0.40"
      RIGEL_CONFIDENCE_PARSE_ERROR_FALLBACK: "0.75"
    volumes:
      - ./config:/app/config
    ports:
      - "8002:8002"
    command: python -u services/rigel_service.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  galaxz:
    build: .
    image: galaxz:latest
    depends_on:
      aether:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Generation-only by default. Code execution is an explicit opt-in
      # capability handled by a separate skill/runtime.
      RIGEL_EXECUTION_CALIBRATION_ENABLED: "false"
      RIGEL_CONFIDENCE_COMPLETION_THRESHOLD: "0.65"
      RIGEL_CONFIDENCE_FAILURE_THRESHOLD: "0.40"
      RIGEL_CONFIDENCE_PARSE_ERROR_FALLBACK: "0.75"
      JOB_DB_PATH: /var/lib/galaxz/jobs.db
      GOAL_DB_PATH: /var/lib/galaxz/goals.db
      REVIEW_DB_PATH: /var/lib/galaxz/reviews.db
      ARTIFACT_DB_PATH: /var/lib/galaxz/artifacts.db
      NEBULA_DB_PATH: /var/lib/galaxz/nebula.db
      GALAXZ_WORKSPACE_ROOT: /workspace
      GALAXZ_WORKSPACE_ENABLED: "true"
      GALAXZ_WORKSPACE_HOST_PATH: ${GALAXZ_WORKSPACE_HOST_PATH:-/Users/rmehra/Projects/galaxz}
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config
      - ./orion/config:/app/orion/config
      - ./orion/data:/app/orion/data
      - ./agents:/app/agents
      - ${GALAXZ_WORKSPACE_HOST_PATH:-.}:/workspace
      - job-data:/var/lib/galaxz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -u services/andromeda_service.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    image: galaxz:latest
    depends_on:
      aether:
        condition: service_healthy
      pulsar:
        condition: service_healthy
      galaxz:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Generation-only by default. Code execution is an explicit opt-in
      # capability handled by a separate skill/runtime.
      RIGEL_EXECUTION_CALIBRATION_ENABLED: "false"
      JOB_DB_PATH: /var/lib/galaxz/jobs.db
      GOAL_DB_PATH: /var/lib/galaxz/goals.db
      REVIEW_DB_PATH: /var/lib/galaxz/reviews.db
      ARTIFACT_DB_PATH: /var/lib/galaxz/artifacts.db
      NEBULA_DB_PATH: /var/lib/galaxz/nebula.db
      GALAXZ_WORKSPACE_ROOT: /workspace
      GALAXZ_WORKSPACE_ENABLED: "true"
      GALAXZ_WORKSPACE_HOST_PATH: ${GALAXZ_WORKSPACE_HOST_PATH:-/Users/rmehra/Projects/galaxz}
      WORKER_CONCURRENCY: "1"
      WORKER_LEASE_SECONDS: "30"
      WORKER_HEARTBEAT_SECONDS: "10"
    volumes:
      - ./config:/app/config
      - ./orion/config:/app/orion/config
      - ./orion/data:/app/orion/data
      - ./agents:/app/agents
      - ${GALAXZ_WORKSPACE_HOST_PATH:-.}:/workspace
      - job-data:/var/lib/galaxz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -u services/worker_service.py
    restart: unless-stopped

  prism:
    build: ./prism
    image: galaxz-prism:latest
    depends_on:
      galaxz:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_TARGET: http://galaxz:8001
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  job-data:
